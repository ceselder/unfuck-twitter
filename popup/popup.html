<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Twitter Scraper</title>
  <style>
    body { font-family: sans-serif; width: 400px; padding: 10px; }
    pre { background: #f5f5f5; padding: 10px; max-height: 300px; overflow: auto; }
    label { display: block; margin-top: 10px; }
    input[type="text"] { width: 100%; padding: 5px; }
  </style>
</head>
<body>
  <h3>Twitter Scraper</h3>

  <p>Don't forget to set your openrouter key in the settings!</p>
  <label>
    categories of things you do not want to see (unix pipe-separated) (|):
    <input type="text" id="bannedWordsInput" placeholder="Simple ragebait | Nazi speech" />
  </label>

  <label>
    <input type="checkbox" id="deleteCheckbox" />
    Delete tweets from page instead of just labeling
  </label>

  <button id="scrapeBtn">Start</button>

  <script src="popup.js"></script>
</body>
</html>
